server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Windows Docker Desktop: the backend must be reachable from the container.
    # A backend bound only to 127.0.0.1 is not reachable through this address.
    location /maasst/ {
        proxy_pass http://host.docker.internal:5244;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 86400;
        # WebSocket query parameters contain a short-lived JWT.
        access_log off;
    }
}
